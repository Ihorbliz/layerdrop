# Lives in site/.github so it stays inert in the plugin repository.
# It runs only once the contents of site/ are at the root of the public site repository.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only what the site serves
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml .nojekyll assets en privacy roadmap _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
